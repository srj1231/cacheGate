spring:
  application:
    name: cachegate
  datasource:
    url: jdbc:sqlite:/Users/saumyajha/Documents/projects/cachegate/cachegate.db
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always

  main:
    banner-mode: off

  ai:
    mcp:
      server:
        stdio: true
        name: cachegate
        version: 0.1.0

    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.6-flash
        embedding:
          api-key: ${GEMINI_API_KEY}
          options:
            model: gemini-embedding-2
